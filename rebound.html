ef.x;\n   float e = aef.y;\n   lin = float(gl_VertexID)/float(vertex_count-1);\n   float f = aef.z+lin*M_PI*2.;\n   if (e>1.){\n       float theta_max = acos(-1./e);\n       f = 0.0001-theta_max+1.9998*lin*theta_max;\n       lin = sqrt(min(0.5,lin));\n   }\n   if (N != 0) {\n       lin = float( (gl_InstanceID/N - current_index + 2*breadcrumb_N -1)%breadcrumb_N )/float(breadcrumb_N);\n   }\n   float omega = omegaOmegainc.x;\n   float Omega = omegaOmegainc.y;\n   float inc = omegaOmegainc.z;\n   float r = a*(1.-e*e)/(1. + e*cos(f));\n   float cO = cos(Omega);\n   float sO = sin(Omega);\n   float co = cos(omega);\n   float so = sin(omega);\n   float cf = cos(f);\n   float sf = sin(f);\n   float ci = cos(inc);\n   float si = sin(inc);\n   vec3 pos = vec3(r*(cO*(co*cf-so*sf) - sO*(so*cf+co*sf)*ci),r*(sO*(co*cf-so*sf) + cO*(so*cf+co*sf)*ci),+ r*(so*cf+co*sf)*si);\n    gl_Position = mvp*(vec4(focus+pos, 1.0));\n    gl_Position.z = 0.;\n}\n␀#version 300 es\nin vec3 focus;\nin vec3 aef;\nin vec3 omegaOmegainc;\nuniform int vertex_count;\nuniform mat4 mvp;\nout float fog;\nconst float M_PI = 3.14159265359;\nvoid main() {\n   float a = aef.x;\n   float e = aef.y;\n   float lin = float(gl_VertexID/3)/float(vertex_count/3) + float(gl_VertexID%3)/float(vertex_count/3);\n   float f = 2.*M_PI*lin;\n   float theta_max = 0.0;\n   fog = 1.;\n   float r;\n   if (e>1.){\n       theta_max = acos(-1./e);\n       lin = 0.5/float(vertex_count/3+1) ;\n       f = 0.0001-theta_max+1.9998*lin*theta_max;\n       float rmax = -a*(1.-e*e)/(1. + e*cos(f));\n       if (gl_VertexID%3==0) { \n           r = rmax;\n           f = 0.0; \n       }else{\n           lin = float(gl_VertexID/3)/float(vertex_count/3+1) + float(gl_VertexID%3)/float(vertex_count/3+1) - 0.5/float(vertex_count/3+1) ;\n           f = 0.0001-theta_max+1.9998*lin*theta_max;\n           r = a*(1.-e*e)/(1. + e*cos(f));\n       }\n       fog = 1.-abs(r/rmax);\n   }else{ \n       if (gl_VertexID%3==0) { \n           r = 0.;\n       }else{\n           r = a*(1.-e*e)/(1. + e*cos(f));\n       }\n   }\n   float omega = omegaOmegainc.x;\n   float Omega = omegaOmegainc.y;\n   float inc = omegaOmegainc.z;\n   float cO = cos(Omega);\n   float sO = sin(Omega);\n   float co = cos(omega);\n   float so = sin(omega);\n   float cf = cos(f);\n   float sf = sin(f);\n   float ci = cos(inc);\n   float si = sin(inc);\n   vec3 pos = vec3(r*(cO*(co*cf-so*sf) - sO*(so*cf+co*sf)*ci),r*(sO*(co*cf-so*sf) + cO*(so*cf+co*sf)*ci),+ r*(so*cf+co*sf)*si);\n   gl_Position = mvp*(vec4(focus+pos, 1.0));\n   gl_Position.z = 0.;\n}\n␀#version 300 es\nin vec3 vp;\nuniform mat4 mvp;\nuniform vec4 vc;\nout vec4 color;\nuniform int current_index;\nuniform int N;\nuniform int breadcrumb_N;\nvoid main() {\n  gl_Position = mvp*vec4(vp, 1.0);\n  gl_Position.z = 0.;\n  gl_PointSize = 15.0f;\n  color = vc;\n  float age = float( (gl_VertexID/N - current_index + 2*breadcrumb_N -1)%breadcrumb_N +1 )/float(breadcrumb_N);\n  if (N == 0) age = 1.0;\n  color = vec4(vc.xyz,age*vc.a);\n}\n␀#version 300 es\nprecision highp float;out vec4 outcolor;\nin float fog;\nvoid main() {\n  outcolor = vec4(1.,1.,1.,fog*0.3);\n}\n␀#version 300 es\nin vec2 vp;\nin float charpos;\nuniform float scale;\nuniform float aspect;\nuniform float screen_aspect;\nuniform float ypos;\nuniform vec2 pos;\nuniform int rotation;\nin vec2 charval;\nin vec2 texcoord;\nout vec2 Texcoord;\nvoid main() {\n  if (rotation==0) {\n    gl_Position = vec4(pos.x+screen_aspect*scale*(vp.x+charpos*aspect),pos.y+scale*(vp.y-ypos),0.,1.);\n  }else{\n    gl_Position = vec4(pos.x+screen_aspect*scale*(-vp.y),pos.y+scale*(vp.x-ypos+charpos*aspect),0.,1.);\n  }\n  Texcoord = vec2((charval.s+texcoord.s)/16.,(charval.t+texcoord.t)/16.00);\n}\n␀#version 300 es\nprecision highp float;out vec4 outcolor;\nin vec3 normal;\nvoid main() {\n  vec3 lightdir = vec3(1.,1.,1.);\n  float intensity = 0.5+max(0.,0.5*dot(normalize(lightdir),normalize(normal)));\n  outcolor = vec4(intensity,intensity,intensity,1.);\n}\n␀#version 300 es\nprecision highp float;out vec4 outcolor;\nin float lin;\nvoid main() {\n  outcolor = vec4(1.,1.,1.,sqrt(lin));\n}\n␀#version 300 es\nprecision highp float;out vec4 outcolor;\nuniform sampler2D tex;\nin vec2 Texcoord;\nvoid main() {\n  outcolor =   vec4(0.5,0.5,0.5,(1.-texture(tex, Texcoord).r)); \n}\n␀IAS15 is the default integrator of REBOUND.IAS15 stands for Integrator with Adaptive Step-size control, 15th order. It is a very high order, non-symplectic integrator which can handle arbitrary forces (including those who are velocity dependent). It is in most cases accurate down to machine precision (16 significant decimal digits). The IAS15 implementation in REBOUND can integrate variational equations. The algorithm is described in detail in [Rein & Spiegel (2015)] and also in the original paper by [Everhart (1985)]. The timestepping choice is described in [Pham et al. (2024)]. A short [YouTube video] also provides a basic introduction to this integrator.\n\n[Rein & Spiegel (2015)]: https://ui.adsabs.harvard.edu/abs/2015MNRAS.446.1424R/abstract\n[Pham et al. (2024)]: https://ui.adsabs.harvard.edu/abs/2024OJAp....7E...1P/abstract\n[Everhart (1985)]: https://ui.adsabs.harvard.edu/abs/1985ASSL..115..185E/abstract\n[Aarseth (1985)]: https://ui.adsabs.harvard.edu/abs/1985IAUS..113..251A/abstract\n[YouTube video]: https://www.youtube.com/watch?v=UILEgdZt-fw\n␀The Symplectic Epicycle Integrator (SEI), is a mixed variable second order symplectic integrator for the shearing sheet. Its main purpose is to simulate planetary rings in a local corotating frame. See [Rein & Tremaine (2011)] for details. The (vertical) epicyclic frequency `OMEGA` (`OMEGAZ`) needs to be set in the simulation. In previous versions of REBOUND, these variable were defined in the integrator, not the simulation. \n\n[Rein & Tremaine (2011)]: https://ui.adsabs.harvard.edu/abs/2011MNRAS.415.3168R/abstract\n␀This is the Embedded Operator Splitting (EOS) methods described in [Rein (2019)].\n\n[Rein (2019)]: https://ui.adsabs.harvard.edu/abs/2020MNRAS.492.5413R/abstract\n␀SABA are symplectic integrators developed by [Laskar & Robutel (2001)] and [Blanes et al. (2013)]. The implementation in REBOUND supports SABA1, SABA2, SABA3, and SABA4 as well as the corrected versions SABAC1, SABAC2, SABAC3, and SABAC4. Different correctors can be selected. In addition, the following methods with various generalized orders are supported: SABA(8,4,4), SABA(8,6,4), SABA(10,6,4). See [Rein, Tamayo & Brown (2019)]for details on how these methods work. \n\n[Laskar & Robutel (2001)]: https://ui.adsabs.harvard.edu/abs/2001CeMDA..80...39L/abstract\n[Blanes et al. (2013)]: https://ui.adsabs.harvard.edu/abs/2012arXiv1208.0689B/abstract\n[Rein, Tamayo & Brown (2019)]: https://ui.adsabs.harvard.edu/abs/2019MNRAS.489.4632R/abstract\n␀Janus is a bit-wise time-reversible high-order symplectic integrator using a mix of floating point and integer arithmetic. The basic idea and this specific implementation is described in [Rein & Tamayo (2018)].\n\n[Rein & Tamayo (2018)]: https://ui.adsabs.harvard.edu/abs/2018MNRAS.473.3351R/abstract\n␀TRACE is a hybrid (almost) time-reversible integrator, based on the algorithm described in [Hernandez & Dehnen (2023)]. It uses WHFast for long term integrations but switches to BS or IAS15 for all close encounters. TRACE is appropriate for systems with a dominant central mass if particles occasionally have close encounters. This TRACE implementation is described in [Lu, Hernandez & Rein (2024)]. \n\n[Hernandez & Dehnen (2023)]: https://ui.adsabs.harvard.edu/abs/2023MNRAS.522.4639H/abstract\n[Lu, Hernandez & Rein (2024)]: https://ui.adsabs.harvard.edu/abs/2024MNRAS.533.3708L/abstract\n[Pham, Rein, and Spiegel (2024)]: https://ui.adsabs.harvard.edu/abs/2024OJAp....7E...1P/abstract\n␀WHFast512 is a symplectic Wisdom-Holman integrator. It is using Single Instruction Multiple Data (SIMD) parallelism and 512-bit Advanced Vector Extensions (AVX512) to speed up the integration of planetary systems by up to 4.7x compared to the standard version of WHFast. See [Javaheri et al. (2023)] for details on this integrator.\n\nImportant: To use WHFast512 you need to compile and run REBOUND on a computer that has a CPU which supports AVX512 instructions. You will see an error message if you try to use WHFast512 but have not compiled REBOUND with the AVX512 flag. To find out if your CPU supports AVX512 instructions, check for the AVX512 flags by running `cat /proc/cpuinfo | grep avx512`. \n\nNote that you can read Simulationarchives of simulations which used WHFast512 on machines that do not support AVX512 instruction. If a synchronization is required, it will be performed with the standard WHFast integrator. \n\nTo turn on the AVX512 flag in the C version of REBOUND, go to the Makefile in your problem directory. Add this line at the top `export AVX512=1`. Make sure to add the `-march=native` flag to the compiler options. This will optimize your code (and enable AVX512 instruction) for the specific CPU you\'re using. In the Makefile add the line `export OPT=-march=native`. Finally, clean your build directory and (re)-build REBOUND with `make clean && make`. \n\nTo use WHFast512 from python, you also need to compile REBOUND with AVX512 instructions enabled. They are disabled by default and enabled with the AVX512 environment variable. Download latest version of REBOUND. Then set the AVX512 environment variable in your shell with `export AVX512=1` and install rebound with `pip install -e .` form the main directory. \n\nTo allow for the best performance, WHFast512 has certain limitations that WHFast does not have:\n\n- The number of particles cannot exceed 9 (1 star and 8 planets) and needs to be constant.\n- Although you can use WHFast512 with any number of planets (up to 8), the performance is best if the system has either 2, 4, or 8 planets. \n- The gravitational constant needs to be exactly equal to 1. Note that you can always rescale your system such that G=1. \n- The integrator always combines the first and last drift step (`safe_mode=0` for WHFast). \n- No variational or test particles are supported (although a particle can have mass 0). \n- MEGNO and other chaos indicators are not supported.\n- WHFast512 always uses democratic heliocentric coordinates. Jacobi coordinates are not supported. \n- The timestep needs to be constant and the `exact_finish_time` flag needs to be set to 0.\n- The masses of all particles need to be constant."n- Additional forces (other than the GR potential) and REBOUNDx are not supported.\n\n\n[Javaheri et al. (2023)]: https://ui.adsabs.harvard.edu/abs/2023OJAp....6E..29J/abstract\n␀MERCURIUS is a hybrid symplectic integrator very similar to MERCURY by [Chambers (1999)]. It uses WHFast for long term integrations but switches over smoothly to IAS15 for close encounters. The MERCURIUS implementation is described in [Rein et al (2019)].\n\n[Rein et al (2019)]: https://ui.adsabs.harvard.edu/abs/2019MNRAS.485.5490R/abstract\n[Chambers (1999)]: https://ui.adsabs.harvard.edu/abs/1999MNRAS.304..793C/abstract\n␀GLFW Error (%d): %s\n␀Unsupported peri_mode encountered\n␀WHFast is an implementation of the symplectic [Wisdom & Holman (1991)] integrator. It is the best choice for systems in which there is a dominant central object and perturbations to the Keplerian orbits are small. It supports first and second symplectic correctors as well as the kernel method of [Wisdom et al. (1996)] with various different kernels. The basic implementation of WHFast is described in detail in [Rein & Tamayo (2015)]. The higher order aspects of it are described in [Rein, Tamayo & Brown (2019)]. WHFast also supports first order variational equations which can be used in chaos estimators. See [Rein & Tamayo (2016)]. The user can choose between Jacobi, Democratic Heliocentric, WHDS, and barycentric coordinates. Because WHFast is not an adaptive integrator, the user needs to set an appropriaye timestep. Typically, this should be a small fraction (a few percent) of the smallest dynamical timescale in the problem. \n\n[Wisdom & Holman (1991)]: https://ui.adsabs.harvard.edu/abs/1991AJ....102.1528W/abstract\n[Wisdom et al. (1996)]: https://ui.adsabs.harvard.edu/abs/1996FIC....10..217W/abstract\n[Rein & Tamayo (2015)]: https://ui.adsabs.harvard.edu/abs/2015MNRAS.452..376R/abstract\n[Rein, Tamayo & Brown (2019)]: https://ui.adsabs.harvard.edu/abs/2019MNRAS.489.4632R/abstract\n[Rein & Tamayo (2016)]: https://ui.adsabs.harvard.edu/abs/2016MNRAS.459.2275R/abstract\n[Rein & Tamayo (2016)]: https://www.youtube.com/watch?v=ttLUhtNj1Lc\n␀The Gragg-Bulirsch-Stoer integrator (short BS for Bulirsch-Stoer) is an adaptive integrator which uses Richardson extrapolation and the modified midpoint method to obtain solutions to ordinary differential equations. The version in REBOUND is based on the method described in Hairer, Norsett, and Wanner 1993 (see section II.9, page 224ff), specifically the JAVA implementation available in the [Hipparchus package]. The Hipparchus and the REBOUND versions are adaptive in both the timestep and the order of the method for optimal performance. The BS implementation in REBOUND can integrate first and second order variational equations. The BS integrator is particularly useful for short integrations where only medium accuracy is required. For long integrations a symplectic integratoris such as WHFast perform better. For high accuracy integrations the IAS15 integrator generally performs better. Because BS is adaptive, it can handle close encounters. Currently a collision search is only performed after every timestep, i.e. not after a every sub-timestep. The BS integrator tries to keep the error of each coordinate $y$ below $\\epsilon_{abs} + \\epsilon_{rel} \\cdot  \\left|y\\right|$. Note that this applies to both position and velocity coordinates of all particles which implies that the code units you\'re choosing for the integration matter. If you need fine control over the scales used internally, you can set the `getscale` function pointer in `nbody_ode`. \n\nNote: The code does not guarantee that the errors remain below the tolerances. In particular, note that BS is not a symplectic integrator which results in errors growing linearly in time (phase errors grow quadratically in time). It requires some experimentation to find the tolerances that offer the best compromise between accuracy and speed for your specific problem. \n\nCompared to the other integrators in REBOUND, BS can be used to integrate arbitrary ordinary differential equations (ODEs), not just the N-body problem. REBOUND exposes an ODE-API which allows you to make use of this. User-defined ODEs are always integrated with BS. You can choose to integrate the N-body equations with BS as well, or any of the other integrators. If you choose BS for the N-body equations, then BS will treat all ODEs (N-body + all user-defined ones) as one big system of coupled ODEs. This means your timestep will be set by either the N-body problem or the user-defined ODEs, whichever involves the shorter timescale.\n\nIf you choose IAS15 or WHFast for the N-body equation but also have user-defined ODEs, then they cannot be treated as one big coupled system of ODEs anymore. In that case the N-body integration is done first. Then the user-defined ODEs are advanced to the exact same time as the N-body system using BS using whatever timestep is required to achieve the set tolerance. During the integration of the user-defined ODEs, the coordinates of the particles in the N-body simulation are assumed to be fixed at their final position and velocity. This introduces an error. However, if the system evolves adiabatically (the timescales in the user-defined ODEs are much longer than in the N-body problem), then the error will be small. \n\n[Hipparchus package]: https://github.com/Hipparchus-Math/hipparchus/blob/master/hipparchus-ode/src/main/java/org/hipparchus/ode/nonstiff
